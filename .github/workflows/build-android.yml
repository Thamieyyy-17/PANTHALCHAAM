
name: Build PANTHALCHAAM Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Verify source configuration
        run: node scripts/verify-project.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Firebase Cloud Messaging and notification sound
        run: |
          cp google-services.json android/app/google-services.json
          bash scripts/configure-android-fcm.sh

      - name: Generate Android launcher assets
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android

      - name: Set and verify Android app display name
        run: |
          node scripts/set-android-branding.mjs
          node scripts/verify-android-branding.mjs

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PANTHALCHAAM-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
